services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-accidentes_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en su entorno}
      POSTGRES_DB: ${DB_NAME:-accidentes}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  pgdata:

